<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Team Water — offline</title>
  <style>
    :root { --cream: #f6f1e7; --navy: #0a1a33; --cobalt: #2240c4; --muted: #45566b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--cream); color: var(--navy); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 360px; }
    .drop { width: 64px; height: 64px; margin: 0 auto 20px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.6rem; margin: 0 0 8px; }
    p { margin: 0 0 6px; color: var(--muted); line-height: 1.5; }
    .ur { direction: rtl; font-size: 1.1rem; margin-top: 14px; }
    button { margin-top: 24px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--cobalt);
      color: #fff; font-size: 1rem; font-weight: 600; box-shadow: 3px 3px 0 var(--navy); }
    button:focus-visible { outline: 3px solid #ffb000; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <svg class="drop" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6C24 18 14 29 14 40a18 18 0 0 0 36 0C50 29 40 18 32 6Z" fill="#2240c4"/><path d="M24 42a8 8 0 0 0 8 8" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
    <h1>No internet connection</h1>
    <p>Team Water needs the internet to find nearby water plants. Check your connection and try again.</p>
    <p class="ur" lang="ur">انٹرنیٹ کنکشن نہیں ہے۔ اپنا کنکشن چیک کریں اور دوبارہ کوشش کریں۔</p>
    <button type="button" id="retry">Try again · دوبارہ کوشش کریں</button>
  </main>
  <script>
    // Keep in step with server.url in capacitor.config.json.
    var SITE = 'https://team-water.vercel.app/';
    document.getElementById('retry').addEventListener('click', function () { window.location.replace(SITE); });
  </script>
</body>
</html>
